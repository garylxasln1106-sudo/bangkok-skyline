<style>
/* Layout: one-screen app. Top bar = name + 视角切换; the 3D stage fills the rest; filters float on the left,
   the detail card slides in on the right (bottom sheet on phones). Price tier is the loudest color on screen. */
:root{
  --bg:#ECEFF1; --panel:#FFFFFF; --panel-2:#F3F5F6; --ink:#15202A; --muted:#5A6874; --line:#D5DCE1;
  --accent:#FFC21A; --accent-ink:#1E1600;
  --hi:#D2283F; --mid:#16788A; --lo:#64748B; --mall:#D88400; --sight:#2C9A5A; --transit:#3B5BC6; --office:#5B21B6; --night:#C026D3; --area:#475569;
  --sky-top:#BFD1DF; --sky-bot:#EDEBE6; --ground:#E3E0D9; --clay:#F7F5F1; --water:#94C0CE; --park:#B6D29F; --road:#D3CDC0; --rail:#55A563;
  --sand:#EADFC0; --land-lo:#D3DDBD; --land-mid:#A6BD8A; --land-hi:#6C8A5A; --runway:#8B8F96; --beach:#0E8F9C; --view:#7C3AED;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --panel:#151E27; --panel-2:#1B2631; --ink:#E5ECF2; --muted:#94A3B1; --line:#283541;
    --accent:#FFC21A; --accent-ink:#1E1600;
    --hi:#FF4E62; --mid:#3DB6CC; --lo:#9AA8BA; --mall:#FFA62B; --sight:#4CC27E; --transit:#7C9CFF; --office:#A78BFA; --night:#E879F9; --area:#A3B1C2;
    --sky-top:#08101C; --sky-bot:#1F2C42; --ground:#111922; --clay:#3B4756; --water:#1B4156; --park:#1E3828; --road:#2A3543; --rail:#4D9C5B;
    --sand:#5A5340; --land-lo:#2D3B2C; --land-mid:#26412D; --land-hi:#1B3423; --runway:#3D4652; --beach:#3CC8D4; --view:#A78BFA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --panel:#151E27; --panel-2:#1B2631; --ink:#E5ECF2; --muted:#94A3B1; --line:#283541;
  --accent:#FFC21A; --accent-ink:#1E1600;
  --hi:#FF4E62; --mid:#3DB6CC; --lo:#9AA8BA; --mall:#FFA62B; --sight:#4CC27E; --transit:#7C9CFF; --office:#A78BFA; --night:#E879F9; --area:#A3B1C2;
  --sky-top:#08101C; --sky-bot:#1F2C42; --ground:#111922; --clay:#3B4756; --water:#1B4156; --park:#1E3828; --road:#2A3543; --rail:#4D9C5B;
  --sand:#5A5340; --land-lo:#2D3B2C; --land-mid:#26412D; --land-hi:#1B3423; --runway:#3D4652; --beach:#3CC8D4; --view:#A78BFA;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;letter-spacing:.02em;text-wrap:balance}
.brand span{font-family:var(--f-num);font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.views{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none;align-items:center}
.views::-webkit-scrollbar{display:none}
.views .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;padding-left:6px}
.views button{white-space:nowrap;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* stage */
.wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot) 58%,var(--sky-bot))}
.stage{position:absolute;left:0;top:0;overflow:hidden;z-index:1}
#gl{display:block;width:100%;height:100%;touch-action:none}
#photo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .25s}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* pins: a stem from the roof, a bubble on top */
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;margin:0;cursor:pointer;--c:var(--muted)}
.pin[hidden]{display:none}
.pin::before{content:"";position:absolute;left:-1px;bottom:3px;width:2px;height:15px;background:var(--c);opacity:.9}
.pin::after{content:"";position:absolute;left:-4px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--panel)}
.pin .b{position:absolute;bottom:17px;left:0;transform:translateX(-50%);transform-origin:50% 100%;display:flex;align-items:center;gap:5px;
  white-space:nowrap;padding:2px 9px 2px 3px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;
  background:var(--panel);color:var(--ink);border:1.5px solid var(--c);box-shadow:0 3px 10px rgba(10,20,30,.22)}
.pin .b i{font-style:normal;font-family:var(--f-num);font-weight:700;min-width:20px;height:18px;border-radius:9px;padding:0 4px;
  background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:.02em}
.pin.hi{--c:var(--hi)} .pin.hi .b{background:var(--hi);color:#fff} .pin.hi .b i{background:#fff;color:var(--hi)}
.pin.mid{--c:var(--mid)} .pin.lo{--c:var(--lo)} .pin.lo .b{border-style:dashed}
.pin.mall{--c:var(--mall)} .pin.sight{--c:var(--sight)} .pin.transit{--c:var(--transit)}
.pin.transit .b{font-size:11px;padding-right:7px}
.pin.here{--c:var(--accent)} .pin.here .b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)} .pin.here .b i{background:var(--accent-ink);color:var(--accent)}
.pin.tmp{--c:var(--ink)}
.pin.office{--c:var(--office)} .pin.office .b{background:var(--office);color:#fff;font-size:13px;padding:4px 12px 4px 4px;border-color:#fff}
.pin.office .b i{background:#fff;color:var(--office);min-width:22px;height:22px;border-radius:11px}
.pin.office::after{width:12px;height:12px;left:-6px;bottom:-3px;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 2px var(--panel),0 0 0 2px var(--office)}100%{box-shadow:0 0 0 2px var(--panel),0 0 0 18px transparent}}
.pin.night{--c:var(--night)}
.pin.beach{--c:var(--beach)} .pin.view{--c:var(--view)} .pin.port{--c:var(--transit)} .pin.island{--c:var(--sight)} .pin.island .b{border-style:dashed}
.pin.area{--c:var(--area)} .pin.area .b{border-style:dashed}
.pin.transit .b i{background:var(--lc,var(--transit))}
.pin.transit .b{border-color:var(--lc,var(--transit))}
.pin.transit::before,.pin.transit::after{background:var(--lc,var(--transit))}
.pin.p4 .b{opacity:.88}
.pin.dot .b,.pin.dot::before{display:none}
.pin.dot::after{width:7px;height:7px;left:-3.5px}
.pin.sel{z-index:5000!important}
.pin.sel .b{box-shadow:0 0 0 3px var(--accent),0 4px 14px rgba(10,20,30,.3)}
.pin.pop .b{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both}
.pin.pop.dot::after{animation:dotpop .4s ease-out both}
@keyframes pop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
@keyframes dotpop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pin.pop .b,.pin.pop.dot::after,.pin.office::after{animation:none}}

/* floating panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(10,20,30,.16)}
.rail{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;width:212px;max-height:calc(100% - 24px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;z-index:3}
.rail h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip .n{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c,var(--muted))}
.legend-tag{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-tag .demo{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px 1px 2px;font-weight:600;border:1.5px solid var(--c)}
.legend-tag .demo i{font-style:normal;font-family:var(--f-num);font-weight:700;background:var(--c);color:#fff;border-radius:8px;padding:0 4px;font-size:11px}
.legend-tag.hi .demo{--c:var(--hi);background:var(--hi);color:#fff} .legend-tag.hi .demo i{background:#fff;color:var(--hi)}
.legend-tag.mid .demo{--c:var(--mid);background:var(--panel)}
.legend-tag.lo .demo{--c:var(--lo);background:var(--panel);border-style:dashed}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}

function openCard(html, sel) {

function markSel(sel) {
  const prevB = S.sel?.bi;
  if (S.selPin) S.selPin.el.classList.remove('sel');
  S.sel = sel || null; S.selPin = sel?.pin || null;
  if (S.selPin) S.selPin.el.classList.add('sel');

  dirty = true;
}
function closeCard() { card.hidden = true; tmpPin.el.hidden = true; tmpPin.kind = 'off'; markSel(null); }

function selectHotel(h, fly) {
  openCard(hotelCard(h), {bi: h.bi, pin: h.pin});
  ding();
  if (fly) flyTo(h.x, h.y, h.h || 40);
}
function flyCam(tgt, end) {
  const p0 = camera.position.clone(), t0v = controls.target.clone(), t0 = performance.now();
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  (function step(now) {
    const k = Math.min(1, (now - t0) / 1000), e = ease(k);
    camera.position.lerpVectors(p0, end, e); controls.target.lerpVectors(t0v, tgt, e); controls.update(); dirty = true;
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function flyTo(x, y, h) {
  const g = hAt(x, y), tgt = new THREE.Vector3(x, Math.max(g, h - 10), -y);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y < 0.35) { dir.y = 0.35; dir.normalize(); }
  const end = tgt.clone().add(dir.multiplyScalar(Math.max(1100, Math.min(2400, (h - g) * 4 + 900))));
  end.y = Math.max(end.y, tgt.y + 450);
  flyCam(tgt, end);
}

  $('#b-kp').onclick = () => flyArea('all');

// ---------- pins from data ----------
function buildPins() {
  D.hotels.forEach((h, i) => {
    h.pin = mkPin({kind: 'hotel', d: h, cls: `${h.tier} ${h.pr.toLowerCase()}`, glyph: h.pr, label: shortCN(h.cn) || h.en,
      aria: `${h.cn} ${h.en}`, x: h.x, y: h.y, h: h.h || (h.z || 0) + 12,
      prio: (h.pr === 'P4' ? 150 : 330 - +h.pr[1] * 10) + (h.tier === 'hi' ? 40 : 0) + Math.min(30, (h.h || 0) / 10),
      open: () => selectHotel(h, false)});
  });
  for (const pl of D.places) {
    const m = PLACES[pl.key];
    if (!m) continue;
    const glyph = m.glyph || (m.type === 'mall' ? MALL_CLS[m.cls][0] : pl.key === 'airport' ? '机' : {sight: '景', night: '夜', area: '街', beach: '滩', view: '观', port: '港', island: '岛'}[m.type]);
    pl.pin = mkPin({kind: m.type, d: pl, cls: `${m.type}${m.cls ? ' ' + m.cls : ''}`, glyph, label: m.zh,
      x: pl.x, y: pl.y, h: Math.max(pl.bh || 0, pl.z || 0) + (m.type === 'beach' || m.type === 'island' ? 3 : 10),
      prio: m.prio || {port: 640, mall: 620, sight: 600, view: 590, beach: 585, island: 570}[m.type] || 560,
      open: () => { openCard(placeCard(pl), {bi: pl.bi, pin: pl.pin}); ding(); }});
  }
  const seen = [];
  for (const p of D.pois) {                // OSM extras: other malls and named beaches, small and only up close
    const kind = {mall: 'mall', beach: 'beach'}[p.k];
    if (!kind || !p.name || !/^[\x20-\x7E]+$/.test(p.name)) continue;
    if (D.places.some(q => dXY(q, p) < (kind === 'beach' ? 900 : 300))) continue;
    if (seen.some(q => q.label === p.name && Math.hypot(q.x - p.x, q.y - p.y) < 1500)) continue;
    seen.push({label: p.name, x: p.x, y: p.y});
    mkPin({kind, d: p, cls: kind, glyph: kind === 'beach' ? '滩' : '', label: p.name, x: p.x, y: p.y, h: (p.z || 0) + (kind === 'beach' ? 3 : 12),
      prio: kind === 'mall' ? 140 : 130, open: () => openCard(poiCard(p), {bi: -1, pin: null})});
  }
  tmpPin = mkPin({kind: 'off', cls: 'tmp', glyph: '', label: '', x: 0, y: 0, h: 0, prio: 2000, open: () => {}});
  tmpPin.el.hidden = true;
}

// ---------- picking ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;

// zoom toward whatever is under the cursor, like a web map
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
stage.addEventListener('wheel', e => {
  if (mode !== 'sky') return;
  e.preventDefault(); e.stopPropagation();
  const rc = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rc.left) / rc.width * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!terrainHit(ray.ray, hitP) && !ray.ray.intersectPlane(groundPlane, hitP)) hitP.copy(controls.target);
  const f = Math.pow(1.0018, e.deltaY * (e.deltaMode === 1 ? 33 : 1));
  const dist = camera.position.distanceTo(controls.target);
  const k = THREE.MathUtils.clamp(dist * f, controls.minDistance, controls.maxDistance) / dist;
  camera.position.sub(hitP).multiplyScalar(k).add(hitP);
  controls.target.sub(hitP).multiplyScalar(k).add(hitP);
  controls.update(); dirty = true;
}, {capture: true, passive: false});
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  if (mode === 'photo' && +$('#ov').value > 60) return;
  const rc = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rc.left) / rc.width * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(city, false)[0];
  if (!hit) return;
  const bi = city.userData.triB[hit.faceIndex];
  const h = hotelByB.get(bi);
  if (h && hotelOn(h)) selectHotel(h, false);
  else if (poiByB.has(bi)) { const p = poiByB.get(bi); openCard(poiCard(p), {bi, pin: null}); }
  else showBuilding(bi);
});

document.querySelectorAll('#views button').forEach(b => b.onclick = () => flyArea(b.dataset.area));
$('#lb').addEventListener('click', () => { $('#lb').hidden = true; });
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#lb').hidden) $('#lb').hidden = true; else if (!card.hidden) closeCard();
});

// ---------- theme ----------
function retheme() {
  readPalette();
  scene.fog.color.copy(PAL['--sky-bot']);
  for (const m of flats) if (m.userData.key) m.material.color.copy(PAL[m.userData.key]);
  recolor(city); terrainColors();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

// ---------- loop ----------
function loop() {
  if (mode === 'sky' && controls.enabled && controls.update()) dirty = true;
  if (dirty) { renderer.render(scene, camera); placePins(); dirty = false; }
  requestAnimationFrame(loop);
}

// ---------- boot ----------
new Promise((ok, no) => window.CITY ? ok(window.CITY) : no(new Error('assets/city.js 没有找到'))).then(data => {
  D = data;
  decodeTerrain();
  D.hotels.forEach(h => { if (h.bi >= 0) hotelByB.set(h.bi, h); });
  D.pois.forEach(p => { if (p.bi >= 0 && p.k !== 'hotel') poiByB.set(p.bi, p); });
  initScene();
  buildFilters();
  buildPins();
  new ResizeObserver(() => layout()).observe(wrap);
  layout();
  $('#loading').hidden = true;
  requestAnimationFrame(loop);
  setTimeout(popPins, 150);
}).catch(err => {
  $('#loading').innerHTML = `<div><b>城市数据没有载入</b>刷新页面再试一次（${esc(err.message)}）</div>`;
});
})();
</script>
